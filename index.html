<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Placement">
<meta name="description" content="Track theory and coding progress for the 9–30 Oct placement plan.">
<title>Placement Prep Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --navy: #1F3864; --navy-2: #2d4f8a; --accent: #4f7cd6;
    --bg1: #eef2f8; --bg2: #e3eaf6; --card: #ffffff; --line: #dbe2ee;
    --text: #1d2433; --muted: #6b7486;
    --done: #2e7d32; --prog: #ef6c00; --rev: #c62828; --ns: #9aa3b2;
    --must-bg: #fde2e1; --must-fg: #8b1a1a; --imp-bg: #fff2cc; --imp-fg: #7a5a00;
    --radius: 14px; --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text); font-size: 15px; line-height: 1.4;
    background: radial-gradient(1200px 600px at 10% -10%, #dfe8fb 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 0%, #e6dcf6 0%, transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app-header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
    box-shadow: 0 4px 18px rgba(20,40,90,.25);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; opacity: .75; font-size: 12px; font-weight: 400; }
  .overall { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar { height: 10px; background: #ffffff26; border-radius: 99px; overflow: hidden; flex: 1; min-width: 120px; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7ddc8a, #3fbf5b); transition: width .3s ease; }
  .pill { background: #ffffff1f; padding: 4px 10px; border-radius: 99px; font-size: 12px; white-space: nowrap; }
  .pill.warn { background: #ff8a8033; color: #ffe0de; }
  nav.tabs {
    display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; position: sticky; top: 0;
    background: rgba(255,255,255,.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); z-index: 9; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    border: none; background: transparent; padding: 8px 14px; border-radius: 99px; cursor: pointer;
    color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  nav.tabs button.active { background: var(--navy); color: #fff; box-shadow: 0 2px 8px rgba(31,56,100,.3); }
  .toolbar { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .btn {
    border: 1px solid #c7d2e6; background: #fff; color: var(--navy); padding: 7px 11px; border-radius: 10px;
    cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.danger { color: var(--rev); }
  main { padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid rgba(219,226,238,.8); padding: 14px 16px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; color: var(--navy); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card.today { border: 2px solid var(--accent); }
  .meta { color: var(--muted); font-size: 12.5px; }
  .progress-line { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
  .progress-line .bar { background: #e6ebf3; height: 8px; }
  .progress-line .bar > span { background: linear-gradient(90deg, #7ddc8a, #2e7d32); }
  .stat { font-size: 12px; color: var(--muted); white-space: nowrap; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--navy); font-size: 13px; font-weight: 600; padding: 6px 0; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  .topic { margin: 14px 0 6px; font-weight: 700; color: var(--text); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
    padding: 9px 10px; border-radius: 10px; margin-bottom: 6px; background: #f7f9fc; border-left: 4px solid var(--ns);
  }
  .row .res { font-weight: 600; font-size: 13.5px; }
  .row .follow { white-space: pre-line; color: #4a5366; font-size: 12.5px; margin-top: 3px; }
  .row.st-Done { border-left-color: var(--done); background: #f1f8f2; }
  .row.st-In-progress { border-left-color: var(--prog); background: #fff7ee; }
  .row.st-Revise-again { border-left-color: var(--rev); background: #fdf1f1; }
  .row.st-Done .res { color: #5b6475; text-decoration: line-through; text-decoration-color: #9aa3b2; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .tag.must { background: var(--must-bg); color: var(--must-fg); }
  .tag.imp { background: var(--imp-bg); color: var(--imp-fg); }
  .tag.ext { background: #ffe9e9; color: #c00000; font-style: normal; }
  .status {
    border: 1px solid #c7d2e6; border-radius: 10px; padding: 7px 8px; font-size: 13px;
    background: #fff; color: var(--text); min-width: 118px; font-family: inherit;
  }
  .overdue { background: #fdecec; color: var(--rev); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .todaypill { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .filters input, .filters select {
    padding: 9px 10px; border: 1px solid #c7d2e6; border-radius: 10px; font-size: 14px; background: #fff; font-family: inherit; width: 100%;
  }
  .table-wrap { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; max-height: 68vh; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #eef2f8; vertical-align: top; font-size: 13px; }
  th { background: var(--navy); color: #fff; position: sticky; top: 0; font-weight: 600; }
  td.follow { white-space: pre-line; color: #4a5366; font-size: 12px; }
  tr.st-Done td { color: #6b7486; }
  .addon { margin-top: 6px; font-size: 12px; color: #4a5366; background: #f1f4fa; padding: 7px 9px; border-radius: 8px; white-space: pre-wrap; }
  .legend { font-size: 12.5px; color: var(--muted); margin: 2px 0 12px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); text-align: center; padding: 22px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  @media (min-width: 760px) {
    main { padding-top: 22px; }
    .row { padding: 10px 12px; }
  }
  @media (max-width: 560px) {
    .toolbar { margin-left: 0; width: 100%; justify-content: flex-start; }
    .status { min-width: 0; width: 100%; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="icons/icon-192.png" alt="">
    <div><h1>Placement Prep</h1><small>Theory + coding · 9–30 Oct 2026</small></div>
  </div>
  <div class="overall">
    <div class="bar"><span id="overallBar" style="width:0%"></span></div>
    <span class="pill" id="overallText"></span>
    <span class="pill warn" id="overdueText"></span>
  </div>
</header>
<nav class="tabs">
  <button data-tab="area" class="active">By area</button>
  <button data-tab="date">By date</button>
  <button data-tab="all">All items</button>
  <div class="toolbar">
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn danger" id="resetBtn">Reset</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</nav>
<main>
  <section id="view-area"></section>
  <section id="view-date" class="hidden"></section>
  <section id="view-all" class="hidden">
    <div class="filters">
      <input id="search" type="search" placeholder="Search topic or resource…">
      <select id="fTab"><option value="">All tabs</option><option>Theory</option><option>Coding</option></select>
      <select id="fArea"><option value="">All areas</option></select>
      <select id="fPrio"><option value="">Must + Important</option><option>Must</option><option>Important</option></select>
      <select id="fStatus"><option value="">Any status</option></select>
    </div>
    <div class="meta" id="allCount" style="margin-bottom:8px"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Tab</th><th>Area</th><th>Topic</th><th>Priority</th><th>Resource</th><th>What to follow</th><th>Status</th></tr></thead>
        <tbody id="allBody"></tbody>
      </table>
    </div>
  </section>
  <div class="footer">Progress is saved on this device. Use Export to back it up.</div>
</main>

const STATUSES = ["Not started", "In progress", "Done", "Revise again"];
const STORE_KEY = "placement-tracker-v1";
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = localISO(new Date());

let progress = loadProgress();

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
}
function statusOf(item) { return progress[item.id] || "Not started"; }
function setStatus(id, s) {
  progress[id] = s; saveProgress();
  renderEverything();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls = s => "st-" + s.replace(/\s+/g, "-");
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
const fmtDay = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); };

function statusSelect(item) {
  const cur = statusOf(item);
  return `<select class="status" data-id="${item.id}">` +
    STATUSES.map(s => `<option ${s===cur?"selected":""}>${s}</option>`).join("") + `</select>`;
}
function prioTag(p) { return `<span class="tag ${p==="Must"?"must":"imp"}">${esc(p)}</span>`; }
function srcTag(s) { return (s||"").startsWith("External") ? `<span class="tag ext">external</span>` : ""; }

// ---------- Overall
function renderOverall() {
  const total = ITEMS.length;
  const done = ITEMS.filter(i => statusOf(i) === "Done").length;
  const overdue = ITEMS.filter(i => i.date && i.date < TODAY && statusOf(i) !== "Done").length;
  document.getElementById("overallBar").style.width = pct(done, total) + "%";
  document.getElementById("overallText").textContent = `${done} / ${total} done (${pct(done,total)}%)`;
  document.getElementById("overdueText").textContent = `${overdue} overdue`;
}

// ---------- By area
function renderArea() {
  const groups = new Map();
  for (const it of ITEMS) {
    const key = it.tab + " · " + it.area;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  let html = "";
  for (const [key, items] of groups) {
    const done = items.filter(i => statusOf(i)==="Done").length;
    const topics = new Map();
    for (const it of items) { if (!topics.has(it.topic)) topics.set(it.topic, []); topics.get(it.topic).push(it); }
    html += `<div class="card"><h3>${esc(key)}</h3>
      <div class="progress-line"><div class="bar"><span style="width:${pct(done,items.length)}%"></span></div>
      <span class="stat">${done}/${items.length} rows · ${pct(done,items.length)}%</span></div>
      <details><summary>Show topics (${topics.size})</summary>`;
    for (const [topic, tItems] of topics) {
      const td = tItems.filter(i=>statusOf(i)==="Done").length;
      const first = tItems[0];
      html += `<div style="margin:10px 0 4px"><strong>${esc(topic)}</strong> ${prioTag(first.priority)}
        <span class="stat"> ${td}/${tItems.length} done</span></div>`;
      html += `<table><tbody>` + tItems.map(it => `
        <tr class="${cls(statusOf(it))}">
          <td style="width:90px">${it.date ? fmtDay(it.date) : esc(it.dateLabel)}</td>
          <td>${esc(it.resource)} ${srcTag(it.source)}<div class="meta">${esc(it.follow)}</div></td>
          <td style="width:150px">${statusSelect(it)}</td></tr>`).join("") + `</tbody></table>`;
    }
    html += `</details></div>`;
  }
  document.getElementById("view-area").innerHTML = html;
}


function addonHtml(it) {
  if (!it.addon) return "";
  const names = it.addon.split(/\n(?=\d+\) )/);
  const follows = (it.addonFollow || "").split(/\n(?=\d+\) )/);
  const rows = names.map((n, i) => {
    const name = n.replace(/^\d+\) /, "");
    const f = (follows[i] || "").replace(/^\d+\) /, "");
    return `<div style="margin-top:5px"><strong>${esc(name)}</strong>${f ? `<div style="white-space:pre-line">${esc(f)}</div>` : ""}</div>`;
  }).join("");
  return `<div class="addon"><strong>Add-on resources</strong>${rows}</div>`;
}

// ---------- By date
function renderDate() {
  const days = [];
  for (let n = 9; n <= 30; n++) days.push(`2026-10-${pad(n)}`);
  const everyDay = ITEMS.filter(i => !i.date);
  let html = `<div class="legend">Grouped by the target date in your plan. Red = past date and not finished.</div>`;
  html += days.map(day => {
    const items = ITEMS.filter(i => i.date === day);
    const done = items.filter(i => statusOf(i)==="Done").length;
    const late = day < TODAY && done < items.length;
    const todayCls = day === TODAY ? " today" : "";
    return `<div class="card${todayCls}"><h3>${fmtDay(day)}
      ${late ? '<span class="overdue">overdue</span>' : ""}
      ${day===TODAY ? '<span class="todaypill">today</span>' : ""}
      <span class="stat">${done}/${items.length} done</span></h3>
      <div class="progress-line"><div class="bar"><span style="width:${pct(done,items.length)}%"></span></div></div>` +
      (items.length ? items.map(it => `
        <div class="row ${cls(statusOf(it))}">
          <div>
            <div class="meta">${esc(it.area)} · ${esc(it.topic)} ${prioTag(it.priority)} ${srcTag(it.source)}</div>
            <div class="res">${esc(it.resource)}</div>
            <div class="follow">${esc(it.follow)}</div>
            ${addonHtml(it)}
          </div>
          <div>${statusSelect(it)}</div>
        </div>`).join("") : `<div class="meta">Nothing scheduled.</div>`) +
      `</div>`;
  }).join("");
  if (everyDay.length) {
    html += `<div class="card"><h3>Every day</h3>` + everyDay.map(it => `
      <div class="row"><div><div class="meta">${esc(it.area)} · ${esc(it.topic)}</div>
      <div class="res">${esc(it.resource)}</div><div class="follow">${esc(it.follow)}</div></div>
      <div>${statusSelect(it)}</div></div>`).join("") + `</div>`;
  }
  document.getElementById("view-date").innerHTML = html;
}

// ---------- All items
function fillFilters() {
  const areaSel = document.getElementById("fArea");
  if (areaSel.options.length === 1) {
    [...new Set(ITEMS.map(i => i.area))].forEach(a => areaSel.add(new Option(a, a)));
  }
  const stSel = document.getElementById("fStatus");
  if (stSel.options.length === 1) STATUSES.forEach(s => stSel.add(new Option(s, s)));
}
function renderAll() {
  const q = document.getElementById("search").value.toLowerCase();
  const tab = document.getElementById("fTab").value;
  const area = document.getElementById("fArea").value;
  const prio = document.getElementById("fPrio").value;
  const st = document.getElementById("fStatus").value;
  const rows = ITEMS.filter(i =>
    (!tab || i.tab === tab) && (!area || i.area === area) && (!prio || i.priority === prio) &&
    (!st || statusOf(i) === st) &&
    (!q || (i.topic + " " + i.resource + " " + i.follow).toLowerCase().includes(q)));
  document.getElementById("allCount").textContent = `${rows.length} of ${ITEMS.length} rows`;
  document.getElementById("allBody").innerHTML = rows.map(it => `
    <tr class="${cls(statusOf(it))}">
      <td>${it.date ? fmtDay(it.date) : esc(it.dateLabel)}</td>
      <td>${esc(it.tab)}</td>
      <td>${esc(it.area)}</td>
      <td>${esc(it.topic)}</td>
      <td>${prioTag(it.priority)}</td>
      <td>${esc(it.resource)} ${srcTag(it.source)}</td>
      <td class="follow">${esc(it.follow)}</td>
      <td>${statusSelect(it)}</td>
    </tr>`).join("");
}

// ---------- Rendering all
function renderEverything() { renderOverall(); renderArea(); renderDate(); renderAll(); }

// ---------- Events
document.addEventListener("change", e => {
  if (e.target.classList.contains("status")) setStatus(e.target.dataset.id, e.target.value);
});
document.querySelectorAll("nav button[data-tab]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  ["area","date","all"].forEach(v => document.getElementById("view-"+v).classList.toggle("hidden", v !== b.dataset.tab));
}));
["search","fTab","fArea","fPrio","fStatus"].forEach(id => document.getElementById(id).addEventListener("input", renderAll));

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({exported: new Date().toISOString(), progress}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "placement-progress.json"; a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    progress = obj.progress || obj;
    saveProgress(); renderEverything();
  } catch (err) { alert("Could not read that file."); }
};
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset all statuses to Not started? Export first if you want a backup.")) {
    progress = {}; saveProgress(); renderEverything();
  }
};

fillFilters();
renderEverything();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
